<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>할로윈 파티 초대장</title>
<meta name="description" content="10월 31일 토요일 오후 2시, 중랑가족캠핑장에서 만나요.">
<meta name="theme-color" content="#0d0b09">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hyunsohyun.github.io/halloween-party/">
<meta property="og:title" content="할로윈 파티에 초대합니다 👻">
<meta property="og:description" content="10월 31일 토요일 오후 2시 · 중랑가족캠핑장">
<meta property="og:image" content="https://hyunsohyun.github.io/halloween-party/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  html{ -webkit-text-size-adjust: 100%; }
  body{ margin: 0; }
  img{ max-width: 100%; }
  /* Layout: retro flat-vector poster (jack-o'-lantern + peeking ghost, teal frame) as the hero,
     then a torn-ticket info card and a dress-code card continue the same black/cream/orange/teal palette. */
  :root{
    --bg: #0d0b09;
    --card: #19140f;
    --card-edge: rgba(245,234,217,0.16);
    --cream: #f5ead9;
    --ink: #f5ead9;
    --ink-dim: #c7b6a1;
    --orange: #ff7a1a;
    --orange-soft: #ffa24d;
    --orange-deep: #c94f09;
    --teal: #3fc9bf;
    --black: #0d0b09;
    --shadow: rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
    padding-inline: 18px;
    padding-block: 26px;
    display: flex;
    justify-content: center;
  }

  .page{
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ---- poster hero ---- */
  .poster{
    position: relative;
    border: 7px solid var(--teal);
    border-radius: 20px;
    overflow: hidden;
    background: var(--black);
    box-shadow: 0 16px 34px -14px var(--shadow);
  }
  .poster svg{ display: block; width: 100%; height: auto; }
  .headline{ font-family: 'Anton', sans-serif; letter-spacing: .01em; }



  /* ---- ticket card ---- */
  .ticket{
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 22px;
    padding: 26px 22px 24px;
    box-shadow: 0 14px 30px -10px var(--shadow);
  }
  .ticket::before, .ticket::after{
    content: "";
    position: absolute;
    left: 50%;
    width: 26px; height: 26px;
    background: var(--bg);
    border-radius: 50%;
    transform: translateX(-50%);
  }
  .ticket::before{ top: -13px; }
  .ticket::after{ bottom: -13px; }
  .ticket-divider{
    border: none;
    border-top: 2px dashed var(--card-edge);
    margin: 18px 0;
  }
  .ticket-title{
    font-family: 'Black Han Sans', sans-serif;
    font-size: 15px;
    color: var(--teal);
    letter-spacing: .03em;
    margin: 0 0 16px;
  }
  .row{
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .row:last-child{ margin-bottom: 0; }
  .icon{
    flex: none;
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,122,26,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg{ width: 19px; height: 19px; stroke: var(--orange-soft); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .row-label{ font-size: 12px; color: var(--ink-dim); margin-bottom: 2px; }
  .row-value{ font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .row-value.muted{ font-weight: 400; color: var(--ink-dim); font-size: 15px; }

  .copy-btn{
    display: block;
    text-align: center;
    text-decoration: none;
    margin-top: 14px;
    width: 100%;
    border: 1px solid var(--teal);
    background: transparent;
    color: var(--teal);
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
  }
  .copy-btn:active{ background: rgba(245,234,217,0.06); }
  .copy-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ---- dress code ---- */
  .dress{
    background: var(--card);
    border: 1px solid var(--teal);
    border-radius: 22px;
    padding: 22px;
  }
  .dress h2{
    margin-bottom: 14px !important;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--orange-soft);
  }
  .dress .sub{ font-size: 14px; color: var(--ink-dim); margin: 0 0 16px; }
  .check-list{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .check-list li{
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 15px;
    line-height: 1.5;
  }
  .check-list b{ display:block; color: var(--ink); }
  .check-list span.note{ display:block; color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
  .check{
    flex: none;
    width: 22px; height: 22px;
    border-radius: 7px;
    background: var(--teal);
    display:flex; align-items:center; justify-content:center;
    margin-top: 1px;
  }
  .check svg{ width: 13px; height: 13px; stroke: var(--black); fill:none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- footer ---- */
  footer{
    text-align: center;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  footer p{
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.7;
    margin: 0 0 14px;
  }
  footer p strong{ color: var(--orange-soft); }
  .pumpkins{ display:flex; justify-content:center; gap: 10px; margin-bottom: 10px; }
  .pumpkins svg{ width: 28px; height: 28px; }

  /* ---- poster animation ---- */
  .ghost,.blink,.pumpkin,.wing,.party,.tw{ transform-box: fill-box; }
  .ghost{ transform-origin: 50% 100%; animation: peek 5s ease-in-out infinite; }
  .blink{ transform-origin: 50% 50%; animation: blink 5s infinite; }
  .pumpkin{ transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  .glow{ animation: flicker 2.3s linear infinite; }
  .smoke-l{ animation: drift 7s ease-in-out infinite; }
  .smoke-r{ animation: drift 8s ease-in-out infinite reverse; }
  .wing-l{ transform-origin: 100% 60%; animation: flap .42s ease-in-out infinite alternate; }
  .wing-r{ transform-origin: 0% 60%; animation: flap .42s ease-in-out infinite alternate; }
  .bat-bob{ animation: bob 2.4s ease-in-out infinite; }
  .fly{ animation: cross 11s linear infinite; }
  .party{ transform-origin: 50% 50%; animation: wobble 3.6s ease-in-out infinite; }
  .tw{ transform-origin: 50% 50%; animation: twinkle 2.6s ease-in-out infinite; }
  .tw2{ animation-delay: .9s; }
  .tw3{ animation-delay: 1.7s; }

  @keyframes peek{
    0%,12%{ transform: translateY(46px); }
    28%,72%{ transform: translateY(0); }
    50%{ transform: translateY(-7px) rotate(-2deg); }
    90%,100%{ transform: translateY(46px); }
  }
  @keyframes blink{
    0%,40%,46%,60%,66%,100%{ transform: scaleY(1); }
    43%,63%{ transform: scaleY(0.1); }
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1,1); }
    50%{ transform: scale(1.012,0.985); }
  }
  @keyframes flicker{
    0%{ opacity: .45; } 12%{ opacity: .8; } 20%{ opacity: .4; } 34%{ opacity: .85; }
    48%{ opacity: .55; } 60%{ opacity: .9; } 72%{ opacity: .35; } 86%{ opacity: .75; } 100%{ opacity: .45; }
  }
  @keyframes drift{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(7px,-9px); }
  }
  @keyframes flap{
    from{ transform: scaleX(1) scaleY(1); }
    to{ transform: scaleX(.45) scaleY(1.15); }
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-7px); }
  }
  @keyframes cross{
    0%{ transform: translate(440px,250px); }
    45%{ transform: translate(180px,232px); }
    100%{ transform: translate(-50px,262px); }
  }
  @keyframes wobble{
    0%,100%{ transform: rotate(-1.2deg); }
    50%{ transform: rotate(1.2deg) scale(1.02); }
  }
  @keyframes twinkle{
    0%,100%{ transform: scale(.35); opacity: .25; }
    50%{ transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .poster svg *{ animation: none !important; }
    .fly{ transform: translate(250px,236px); }
  }

  .group-label{
    display: inline-block;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 12px;
    letter-spacing: .04em;
    padding: 4px 11px;
    border-radius: 999px;
    margin: 0 0 12px;
  }
  .group-label.must{ background: var(--orange); color: var(--black); }
  .group-label.opt{ border: 1px solid var(--card-edge); color: var(--ink-dim); margin-top: 20px; }
  .check.empty{ background: transparent; border: 2px solid var(--teal); }

  .invite-line{
    margin: 0;
    text-align: center;
    font-family: 'Black Han Sans', 'Gowun Dodum', sans-serif;
    font-size: 20px;
    line-height: 1.4;
    color: var(--cream);
    text-wrap: balance;
  }
  .row-addr{ font-size: 14px; color: var(--ink-dim); margin-top: 3px; user-select: text; }
</style>
</head>
<body>
